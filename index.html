<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幕 — 香港演出與展覽的時間軸</title>
<link rel="stylesheet" href="style.css?v=13" id="css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1 class="logo">幕<small>Hong Kong · What's On</small></h1>
    <div class="navwrap">
      <nav id="filters" aria-label="分類"></nav>
      <a class="toplink" href="about.html">關於</a>
    </div>
  </header>

  <div class="controls" id="controls">
  <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="true" aria-controls="filter-body">
    <span class="ft-label">篩選</span>
    <span class="ft-sum" id="ft-sum"></span>
    <span class="ft-chev" aria-hidden="true"></span>
  </button>
  <div class="filter-body" id="filter-body">
  <div class="jumpbar">
    <label for="jump">由</label>
    <input type="date" id="jump">
    <label for="jump-to">至</label>
    <input type="date" id="jump-to">
    <button type="button" id="jump-clear">全部時段</button>
    <button type="button" id="jump-go">去</button>
  </div>

  <div class="weekbar" id="weekbar">
    <span class="weekbar-label">星期</span>
  </div>

  <div class="placebar">
    <label for="place">地點</label>
    <input id="place" list="places" placeholder="場地名或關鍵字" autocomplete="off">
    <datalist id="places"></datalist>
    <label for="tfrom">時間</label>
    <select id="tfrom"><option value="">任何</option></select>
    <span class="dash">至</span>
    <select id="tto"><option value="">任何</option></select>
    <div class="fontbar">
      <span class="fontbar-label">字</span>
      <button type="button" class="fs" data-fs="s">小</button>
      <button type="button" class="fs on" data-fs="m">中</button>
      <button type="button" class="fs" data-fs="l">大</button>
    </div>
  </div>

  <div class="contentbar" id="contentbar">
    <span class="contentbar-label">內容</span>
    <div class="chips" id="contentchips"></div>
    <span class="contentbar-hint">點一下只看這類，可多選</span>
  </div>
  </div>
  </div>

  <section class="band" id="band" hidden data-open="0">
    <h2 id="band-title">展出中 · 展覽</h2>
    <p class="band-note" id="band-note">檔期較長，與演出分開看。</p>
    <ul id="band-list"></ul>
  </section>

  <main class="timeline" id="timeline"></main>

  <footer id="foot"></footer>

  <section class="about">
    <h2>關於</h2>
    <p>把香港幾個場地和藝團的節目表，併成同一條時間軸。不為賣票，只為讓你在某個沒事的晚上，剛好滑到一場想看的演出。</p>
    <p>資料每月更新一次。過期的不刪，標上「已結束」。</p>
    <p class="by">Hector Tam　·　君秋雪　·　二〇二六年十月</p>
  </section>
</div>

<script>
(function () {
  window.__start = function start() {
  var CAL = window.CALENDAR || { shows: [], exhibits: [], updated: "" };
  var TODAY = new Date().toISOString().slice(0, 10);
  var WD = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  var TYPES = ["全部", "音樂劇", "話劇", "舞蹈", "音樂會", "戲曲", "電影", "展覽", "其他"];
  var state = { type: "全部", from: "", to: "", days: [], place: "", tFrom: "", tTo: "", topics: [] };
  // 源 → 官方首頁。條目自己沒有單頁網址時，至少讓他知道「這條從哪來、要去哪裡看」
  var SOURCES = {
    lcsd:   { label: "康文署",       url: "https://www.lcsd.gov.hk/tc/" },
    westk:  { label: "西九文化區",   url: "https://www.westk.hk/tc" },
    hkapa:  { label: "香港演藝學院", url: "https://www.hkapa.edu/" },
    hkphil: { label: "香港管弦樂團", url: "https://www.hkphil.org/tc" },
    hkaf:   { label: "香港藝術節",   url: "https://www.hk.artsfestival.org/tc" },
    hkrep:  { label: "香港話劇團",   url: "https://www.hkrep.com/" },
    hkdance:{ label: "香港舞蹈團",   url: "https://www.hkdance.com/" },
    ccohk:  { label: "香港城市室樂團", url: "https://www.ccohk.com/" },
    mplus:  { label: "M+",           url: "https://www.mplus.org.hk/tc/" },
    hkmoa:  { label: "香港藝術館",   url: "https://hk.art.museum/tc/web/ma/" },
    heritage:{ label: "香港文化博物館", url: "https://hk.heritage.museum/tc/" }
  };
  var WEEK_CHIPS = [
    { label: "平日", days: [1, 2, 3, 4, 5] },
    { label: "週末", days: [0, 6] },
    { label: "一", days: [1] }, { label: "二", days: [2] },
    { label: "三", days: [3] }, { label: "四", days: [4] },
    { label: "五", days: [5] }, { label: "六", days: [6] },
    { label: "日", days: [0] }
  ];
  var BAND_PREVIEW = 10;   // 展覽帶先露幾條，其餘可展開

  // 內容類別：跨所有演出都成立的「取向」，不是音樂流派。
  // 資料裡沒有現成欄位，所以按標題＋簡介的關鍵字歸類；使用者點一下只看這類，可多選。
  var TOPICS = [
    { key: "新作", re: /首演|新作|新編|全新|委約|原創|新製作|新劇|實驗|沉浸|多媒體|跨媒介|跨界|前衛|舞蹈節|藝術節|重塑|重構/ },
    { key: "經典重演", re: /經典|名作|重演|再演|傳承|保留劇目|代表作/ },
    { key: "傳統", re: /粵劇|粵曲|戲曲|京劇|崑劇|崑曲|南音|神功戲|戲寶|粵藝|粵韻|中樂|國樂|絲竹|書畫|水墨|書法|文物|敦煌|非遺|故宮|館藏/ },
    { key: "懷舊金曲", re: /金曲|懷舊|老歌|名曲|會知音|獻知音|歲月|好歌|靚聲|群星|歌皇|歌后|當年|舊夢|往日/ },
    { key: "社區業餘", re: /師生|學員|匯演|聯演|同樂|慈善|耆英|耆康|長者|敬老|社區|地區|會員|好友|展演|培訓|青少年|中學|小學|大學|學校|校友|街坊|坊眾|居民|同鄉|宗親|商會|工會|義工|劇社|戲劇社|曲藝社|樂社|研習|結業|慶回歸|賀國慶|國慶/ },
    { key: "大眾娛樂", re: /演唱會|流行|搖滾|爵士|綜藝|巡迴|巡演|音樂節|棟篤笑|魔術|電音|嘻哈|無伴奏|A cappella/ },
    { key: "親子", re: /兒童|親子|童話|繪本|小朋友|家庭|幼兒/ }
  ];

  function topicsOf(x) {
    if (x.__t) return x.__t;
    var s = (x.title || "") + " " + (x.desc || "");
    var t = [];
    for (var i = 0; i < TOPICS.length; i++) {
      if (TOPICS[i].re.test(s)) t.push(TOPICS[i].key);
    }
    x.__t = t;
    return t;
  }

  function applyTopics(list) {
    if (!state.topics.length) return list;
    return list.filter(function (x) {
      var t = topicsOf(x);
      for (var i = 0; i < state.topics.length; i++) {
        if (t.indexOf(state.topics[i]) >= 0) return true;
      }
      return false;
    });
  }

  function countTopics(pool) {
    var c = {};
    TOPICS.forEach(function (t) { c[t.key] = 0; });
    pool.forEach(function (x) {
      topicsOf(x).forEach(function (k) { if (c[k] != null) c[k]++; });
    });
    return c;
  }

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function monthLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
  }
  function dayLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }
  function wd(iso) { return WD[new Date(iso + "T00:00:00").getDay()]; }
  // 展期可能是空的（常設／長期展），比較大小時給一個很遠的日期
  function endOf(x) { return x.end || "9999-12-31"; }

  function renderFilters() {
    var nav = document.getElementById("filters");
    nav.innerHTML = "";
    TYPES.forEach(function (t) {
      var b = el("button", null, t);
      b.setAttribute("aria-pressed", String(state.type === t));
      b.onclick = function () { state.type = t; renderAll(); };
      nav.appendChild(b);
    });
  }

  // 每一條自己的內容類別（跟上面那行篩選同一套規則）
  // 跟大類標籤重複就不貼（「戲曲」不用再寫一次「戲曲」）
  function ctagNode(x) {
    var t = topicsOf(x);
    for (var i = 0; i < t.length; i++) {
      if (t[i] !== x.type) return el("span", "ctag", t[i]);
    }
    return null;
  }

  // 展覽檔期文字：同年只寫月日，跨年寫完整
  function spanText(x) {
    var a = x.d, b = x.end;
    if (!b) return x.open ? (a.slice(5).replace("-", ".") + " 起・常設") : a;
    if (x.open) return "常設・展至 " + (a.slice(0, 4) === b.slice(0, 4) ? b.slice(5).replace("-", ".") : b);
    if (a.slice(0, 4) === b.slice(0, 4)) {
      return a.slice(5).replace("-", ".") + " – " + b.slice(5).replace("-", ".");
    }
    return a + " – " + b;
  }
  function daysBetween(x) {
    var t1 = new Date(x.d + "T00:00:00"), t2 = new Date(x.end + "T00:00:00");
    return Math.max(1, Math.round((t2 - t1) / 86400000) + 1);
  }
  function kindBadge(isExhibit) {
    return el("span", isExhibit ? "kind k-ex" : "kind k-show", isExhibit ? "展覽" : "演出");
  }

  // 來源標籤：能精確到「這個節目」就精確；沒有單頁時退到場地節目表；再沒有就不給連結
  function sourceNode(x) {
    var s = SOURCES[x.source];
    var label = s ? s.label : x.source;
    var href = x.url || x.src_url || "";
    if (!href) return el("span", "src no-link", "來源：" + label);
    var a = el("a", "src", "來源：" + label);
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    a.title = x.url ? (label + " · 這個節目的頁面") : (label + " · 該場地節目表");
    return a;
  }

  function renderBand() {
    var band = document.getElementById("band");
    var list = document.getElementById("band-list");
    var title = document.getElementById("band-title");
    // 展覽帶只在「全部」下出現（「展覽」分類本身已經把展覽全列出來，不重複）
    if (state.type !== "全部" || state.from || state.days.length) {
      band.hidden = true; return;
    }
    var items = applyTopics(CAL.exhibits.filter(function (x) { return endOf(x) >= TODAY; }));
    list.innerHTML = "";
    if (!items.length) { band.hidden = true; return; }
    band.hidden = false;
    title.textContent = "展出中 · 展覽（" + items.length + "）";
    var open = band.getAttribute("data-open") === "1";
    var show = open ? items : items.slice(0, BAND_PREVIEW);
    show.forEach(function (x) {
      var li = el("li");
      var a;
      if (x.url) {
        a = el("a", "band-link", x.title);
        a.href = x.url; a.target = "_blank"; a.rel = "noopener";
      } else {
        a = el("span", "band-link no-link", x.title);
      }
      li.appendChild(a);
      li.appendChild(el("span", "band-date", "　" + spanText(x)));
      list.appendChild(li);
    });
    if (items.length > BAND_PREVIEW) {
      var li2 = el("li", "band-toggle");
      var btn = el("button", null, open ? "收起" : "還有 " + (items.length - BAND_PREVIEW) + " 個 · 展開全部");
      btn.type = "button";
      btn.onclick = function () {
        band.setAttribute("data-open", open ? "0" : "1");
        renderBand();
      };
      li2.appendChild(btn);
      list.appendChild(li2);
    }
  }

  function itemRow(x, past) {
    var row = el("div", "item" + (past ? " past" : ""));
    var time = el("div", "item-time", past ? "已結束" : (x.time || ""));
    var body = el("div", "item-body");

    var a;
    if (x.url) {
      a = el("a", "item-title", x.title);
      a.href = x.url; a.target = "_blank"; a.rel = "noopener";
    } else {
      a = el("span", "item-title no-link", x.title);
    }
    body.appendChild(a);

    var meta = el("div", "item-meta");
    meta.appendChild(kindBadge(x.type === "展覽"));
    if (x.venue) meta.appendChild(el("span", null, x.venue));
    var tag = el("span", "tag", x.type);
    tag.setAttribute("data-t", x.type);
    meta.appendChild(tag);
    var ct = ctagNode(x);
    if (ct) meta.appendChild(ct);
    if (x.source) meta.appendChild(sourceNode(x));
    body.appendChild(meta);

    // 简介：只有部分源给得到（舞蹈团、室乐团），有就折两行，点一下展开
    if (x.desc) {
      var d = el("div", "item-desc", x.desc);
      d.addEventListener("click", function () { d.classList.toggle("open"); });
      body.appendChild(d);
    }

    row.appendChild(time);
    row.appendChild(body);
    return row;
  }

  // 大類 + 日期 + 星期 + 地點 + 時間：這一層先算好，內容類別另外加在上面
  function basePool() {
    var pool;
    if (state.type === "展覽") {
      // 展覽分兩攤：檔期長的進了上方橫帶（CAL.exhibits），短的留在時間軸（CAL.shows）。
      // 點「展覽」要看全部，兩邊都要拿，否則只剩那十幾條。
      pool = CAL.exhibits.concat(CAL.shows.filter(function (x) { return x.type === "展覽"; }))
        .filter(function (x) { return endOf(x) >= TODAY; })
        .sort(function (a, b) { return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
    } else {
      pool = CAL.shows.filter(function (x) {
        if (x.d < TODAY) return false;
        return state.type === "全部" || x.type === state.type;
      });
    }

    // 日期范围筛选：只显示这几天
    if (state.from) pool = pool.filter(function (x) { return x.d >= state.from; });
    if (state.to) pool = pool.filter(function (x) { return x.d <= state.to; });
    // 星期筛选
    if (state.days.length) {
      pool = pool.filter(function (x) {
        return state.days.indexOf(new Date(x.d + "T00:00:00").getDay()) >= 0;
      });
    }
    // 地点 / 关键字
    if (state.place) {
      var q = state.place.toLowerCase();
      pool = pool.filter(function (x) {
        return ((x.venue || "") + " " + (x.title || "")).toLowerCase().indexOf(q) >= 0;
      });
    }
    // 时间段
    if (state.tFrom || state.tTo) {
      pool = pool.filter(function (x) {
        if (!x.time) return false;
        return x.time.split(/[\u3001,\uff0c]/).some(function (t) {
          t = t.trim();
          if (!/^\d{2}:\d{2}$/.test(t)) return false;
          if (state.tFrom && t < state.tFrom) return false;
          if (state.tTo && t > state.tTo) return false;
          return true;
        });
      });
    }

    return pool;
  }

  function renderTimeline(pool) {
    var box = document.getElementById("timeline");
    box.innerHTML = "";

    pool = applyTopics(pool);

    if (!pool.length) {
      var hasTopic = state.topics.length > 0;
      var e = el("div", "empty", hasTopic ? "這類內容目前沒有節目。" : "這段時間還沒有公布。");
      e.appendChild(el("span", null, hasTopic
        ? "把內容類別取消，或換一個類別試試。"
        : "香港多數藝團只提前三到六個月公布，之後會陸續增加。"));
      box.appendChild(e);
      return;
    }

    var shown = pool;
    if (state.type === "展覽") {
      var m1 = el("div", "month", "展覽 · 展出中");
      m1.appendChild(el("em", null, "EXHIBITIONS"));
      box.appendChild(m1);
      shown.forEach(function (x) {
        var d = el("div", "day");
        var left = el("div", "day-date", spanText(x));
        left.appendChild(el("em", null, x.open ? "長期展出" : daysBetween(x) + " 天"));
        var items = el("div", "items");
        var row = el("div", "item");
        row.appendChild(el("div", "item-time", ""));
        var body = el("div", "item-body");
        var a;
        if (x.url) {
          a = el("a", "item-title", x.title);
          a.href = x.url; a.target = "_blank"; a.rel = "noopener";
        } else {
          a = el("span", "item-title no-link", x.title);
        }
        body.appendChild(a);
        var meta = el("div", "item-meta");
        meta.appendChild(kindBadge(true));
        if (x.venue) meta.appendChild(el("span", null, x.venue));
        var tag = el("span", "tag", "展覽"); tag.setAttribute("data-t", "展覽");
        meta.appendChild(tag);
        var ct2 = ctagNode(x);
        if (ct2) meta.appendChild(ct2);
        if (x.source) meta.appendChild(sourceNode(x));
        body.appendChild(meta);
        row.appendChild(body);
        items.appendChild(row);
        d.appendChild(left); d.appendChild(items);
        box.appendChild(d);
      });
      return;
    }

    var currentMonth = "";
    shown.forEach(function (x) {
      var m = monthLabel(x.d);
      if (m !== currentMonth) {
        currentMonth = m;
        var h = el("div", "month", m);
        h.appendChild(el("em", null, "UPCOMING"));
        box.appendChild(h);
      }
      // 同一天合併成一組
      var lastDay = box.lastElementChild;
      if (!lastDay || !lastDay.classList.contains("day") ||
          lastDay.getAttribute("data-d") !== x.d) {
        var day = el("div", "day");
        day.setAttribute("data-d", x.d);
        var left = el("div", "day-date", dayLabel(x.d));
        left.appendChild(el("em", null, wd(x.d)));
        var items = el("div", "items");
        day.appendChild(left);
        day.appendChild(items);
        box.appendChild(day);
      }
      box.lastElementChild.querySelector(".items").appendChild(itemRow(x, false));
    });
  }

  function renderFoot() {
    var f = document.getElementById("foot");
    f.innerHTML = "";
    var lastShow = "", lastEx = "";
    CAL.shows.forEach(function (x) { if (x.type !== "展覽" && x.d > lastShow) lastShow = x.d; });
    // 展覽分兩攤（時間軸裡的短期展 + 上方横帶的長展），數數兩邊都算
    var shortEx = CAL.shows.filter(function (x) { return x.type === "展覽"; });
    shortEx.forEach(function (x) { if (x.end > lastEx) lastEx = x.end; });
    CAL.exhibits.forEach(function (x) { if (x.end > lastEx) lastEx = x.end; });
    var exCount = CAL.exhibits.length + shortEx.length;
    f.appendChild(el("p", null, "資料更新：" + CAL.updated));
    f.appendChild(el("p", null,
      "演出 " + (CAL.shows.length - shortEx.length) + " 場，最遠到 " + lastShow +
      "　·　展覽 " + exCount + " 個（含短期展），最遠到 " + lastEx));
    f.appendChild(el("p", null,
      "來源：康文署、西九文化區、香港演藝學院、香港管弦樂團、香港藝術節、香港話劇團、香港舞蹈團、香港城市室樂團、M+、香港藝術館、香港文化博物館。"));
    f.appendChild(el("p", null,
      "每個月抓一次。抓不到的就不寫，不猜。"));
    f.appendChild(el("p", "disclaimer",
      "資料來自各場地與藝團的公開網頁，可能過時或有錯；一切以主辦方公布為準。"));
  }

  function renderWeekChips() {
    var box = document.getElementById("weekbar");
    box.innerHTML = '<span class="weekbar-label">星期</span>';
    WEEK_CHIPS.forEach(function (c) {
      // 单个星期：只要在这个集合里就算选中；「平日」「週末」这种组合：集合完全相等才算
      var pressed = (c.days.length === 1)
        ? state.days.indexOf(c.days[0]) >= 0
        : (c.days.length === state.days.length &&
           c.days.every(function (d) { return state.days.indexOf(d) >= 0; }));
      var b = el("button", pressed ? "wchip on" : "wchip", c.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(pressed));
      b.onclick = function () {
        if (c.days.length === 1) {
          var i = state.days.indexOf(c.days[0]);
          if (i >= 0) state.days.splice(i, 1);
          else state.days.push(c.days[0]);
        } else {
          state.days = pressed ? [] : c.days.slice();
        }
        renderAll();
      };
      box.appendChild(b);
    });
    if (state.days.length) {
      var c2 = el("button", "wchip clear", "清除星期");
      c2.type = "button";
      c2.onclick = function () { state.days = []; renderAll(); };
      box.appendChild(c2);
    }
  }

  function renderContentChips(counts) {
    var box = document.getElementById("contentchips");
    if (!box) return;
    box.innerHTML = "";
    TOPICS.forEach(function (tp) {
      var on = state.topics.indexOf(tp.key) >= 0;
      var b = el("button", "chip" + (on ? " c-on" : ""));
      b.type = "button";
      b.setAttribute("aria-pressed", String(on));
      b.appendChild(document.createTextNode(tp.key));
      var n = counts ? counts[tp.key] : 0;
      if (n) b.appendChild(el("span", "n", String(n)));
      b.onclick = function () {
        var i = state.topics.indexOf(tp.key);
        if (i >= 0) state.topics.splice(i, 1);
        else state.topics.push(tp.key);
        renderAll();
      };
      box.appendChild(b);
    });
  }

  // 收起時那一行摘要：讓他知道現在還掛著哪些條件
  function updateFilterSummary() {
    var s = document.getElementById("ft-sum");
    var btn = document.getElementById("filter-toggle");
    if (!s) return;
    var parts = [];
    if (state.type && state.type !== "全部") parts.push(state.type);
    if (state.from || state.to) {
      var a = state.from || state.to, b = state.to || state.from;
      parts.push(a === b ? dayLabel(a) : dayLabel(a) + "–" + dayLabel(b));
    }
    if (state.days.length) {
      var ds = state.days.slice().sort();
      if (ds.join(",") === "1,2,3,4,5") parts.push("平日");
      else if (ds.join(",") === "0,6") parts.push("週末");
      else parts.push("週" + ds.map(function (d) { return "日一二三四五六"[d]; }).join("・"));
    }
    if (state.place) parts.push("地點：" + state.place);
    if (state.tFrom || state.tTo) parts.push((state.tFrom || "" ) + "–" + (state.tTo || ""));
    if (state.topics.length) parts.push("內容：" + state.topics.join("、"));
    var txt = parts.length ? parts.join(" · ") : "日期 · 星期 · 地點 · 內容";
    s.textContent = txt;
    s.title = txt;
    if (btn) btn.classList.toggle("has-filter", parts.length > 0);
  }

  function renderAll() {
    renderWeekChips();
    renderFilters();
    var pool = basePool();
    renderContentChips(countTopics(pool));
    renderBand();
    renderTimeline(pool);
    renderFoot();
    updateFilterSummary();
  }

  document.getElementById('jump-go').addEventListener('click', function () {
    var f = document.getElementById('jump').value;
    var t = document.getElementById('jump-to').value;
    if (!f && !t) return;
    state.from = f || t;
    state.to = t || f;
    if (state.from > state.to) { var tmp = state.from; state.from = state.to; state.to = tmp; }
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.getElementById('jump-clear').addEventListener('click', function () {
    state.from = ''; state.to = '';
    document.getElementById('jump').value = '';
    document.getElementById('jump-to').value = '';
    renderAll();
  });

  (function initPlaceTime() {
    var venues = {};
    (CAL.shows || []).concat(CAL.exhibits || []).forEach(function (x) {
      if (x.venue) venues[x.venue] = 1;
    });
    var dl = document.getElementById('places');
    Object.keys(venues).sort().forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      dl.appendChild(o);
    });
    ['tfrom', 'tto'].forEach(function (id) {
      var sel = document.getElementById(id);
      for (var h = 0; h < 24; h++) {
        var v = (h < 10 ? '0' : '') + h + ':00';
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        sel.appendChild(o);
      }
    });
    document.getElementById('place').addEventListener('input', function () {
      state.place = this.value.trim(); renderAll();
    });
    document.getElementById('tfrom').addEventListener('change', function () {
      state.tFrom = this.value; renderAll();
    });
    document.getElementById('tto').addEventListener('change', function () {
      state.tTo = this.value; renderAll();
    });
  })();

  renderAll();

  // 站頭（站名、分類、「關於」）也黏在視窗頂；篩選列要接在它下面，
  // 所以量一次它的高度寫進 CSS 變數，視窗變大變小時重新量。
  function syncMastHeight() {
    var m = document.querySelector('.masthead');
    if (m) document.documentElement.style.setProperty('--mast-h', m.offsetHeight + 'px');
  }
  syncMastHeight();
  window.addEventListener('resize', syncMastHeight);
  window.addEventListener('load', syncMastHeight);
  setTimeout(syncMastHeight, 300);
  if (window.ResizeObserver) {
    try { new ResizeObserver(syncMastHeight).observe(document.querySelector('.masthead')); } catch (e) {}
  }

  // 捲下去就把站頭縮小（只留「幕」、分類、「關於」），不然黏在頂上佔太多畫面

  // 字號：小／中／大，記在 localStorage，下次打開沿用
  (function initFontSize() {
    var KEY = 'muk-fs';
    var btns = document.querySelectorAll('.fontbar .fs');
    function apply(v) {
      document.body.classList.remove('fs-s', 'fs-l');
      if (v === 's') document.body.classList.add('fs-s');
      if (v === 'l') document.body.classList.add('fs-l');
      btns.forEach(function (b) {
        var on = b.getAttribute('data-fs') === v;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
      syncMastHeight();
    }
    var saved = 'm';
    try { saved = localStorage.getItem(KEY) || 'm'; } catch (e) {}
    apply(saved);
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-fs');
        try { localStorage.setItem(KEY, v); } catch (e) {}
        apply(v);
      });
    });
  })();

  // 篩選列收合：手機默認收起（不然黏在頂上佔半個畫面），桌面默認展開；選擇記住
  (function initFilterToggle() {
    var KEY = 'muk-filters-open';
    var box = document.getElementById('controls');
    var btn = document.getElementById('filter-toggle');
    if (!box || !btn) return;
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    var open = (saved === '1' || saved === '0') ? (saved === '1') : (window.innerWidth > 700);
    function apply(o) {
      box.classList.toggle('collapsed', !o);
      btn.setAttribute('aria-expanded', String(o));
      var chev = btn.querySelector('.ft-chev');
      if (chev) chev.textContent = o ? '收起' : '展開';
    }
    apply(open);
    btn.addEventListener('click', function () {
      var o = box.classList.contains('collapsed');
      try { localStorage.setItem(KEY, o ? '1' : '0'); } catch (e) {}
      apply(o);
    });
  })();
  };

  // 每次打开都用当前时间戳拉 data.js / style.css，避开浏览器缓存
  var l = document.getElementById('css');
  if (l) l.href = 'style.css?t=' + Date.now();

  var s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();
  s.onload = function () { window.__start(); };
  s.onerror = function () { window.__start(); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
