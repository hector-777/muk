<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幕 — 香港演出與展覽的時間軸</title>
<link rel="stylesheet" href="style.css?v=13" id="css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1 class="logo">幕<small>Hong Kong · What's On</small></h1>
    <div class="navwrap">
      <nav id="filters" aria-label="分類"></nav>
      <a class="toplink" href="about.html">關於</a>
    </div>
  </header>

  <div class="controls" id="controls">
  <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="true" aria-controls="filter-body">
    <span class="ft-label">篩選</span>
    <span class="ft-sum" id="ft-sum"></span>
    <span class="ft-chev" aria-hidden="true"></span>
  </button>
  <div class="filter-body" id="filter-body">
  <div class="jumpbar">
    <label for="jump">由</label>
    <input type="date" id="jump">
    <label for="jump-to">至</label>
    <input type="date" id="jump-to">
    <button type="button" id="jump-clear">全部時段</button>
    <button type="button" id="jump-go">去</button>
  </div>

  <div class="weekbar" id="weekbar">
    <span class="weekbar-label">星期</span>
  </div>

  <div class="placebar">
    <label for="place">地點</label>
    <input id="place" list="places" placeholder="場地名或關鍵字" autocomplete="off">
    <datalist id="places"></datalist>
    <label for="tfrom">時間</label>
    <select id="tfrom"><option value="">任何</option></select>
    <span class="dash">至</span>
    <select id="tto"><option value="">任何</option></select>
    <div class="fontbar">
      <span class="fontbar-label">字</span>
      <button type="button" class="fs" data-fs="s">小</button>
      <button type="button" class="fs on" data-fs="m">中</button>
      <button type="button" class="fs" data-fs="l">大</button>
    </div>
  </div>

  <div class="contentbar" id="contentbar">
    <span class="contentbar-label">內容</span>
    <div class="chips" id="contentchips"></div>
    <span class="contentbar-hint">點一下只看這類，可多選</span>
  </div>
  </div>
  </div>

  <section class="band" id="band" hidden data-open="0">
    <h2 id="band-title">展出中 · 展覽</h2>
    <p class="band-note" id="band-note">檔期較長，與演出分開看。</p>
    <ul id="band-list"></ul>
  </section>

  <main class="timeline" id="timeline"></main>

  <footer id="foot"></footer>

  <section class="about">
    <h2>關於</h2>
    <p>把香港幾個場地和藝團的節目表，併成同一條時間軸。不為賣票，只為讓你在某個沒事的晚上，剛好滑到一場想看的演出。</p>
    <p>資料每月更新一次。過期的不刪，標上「已結束」。</p>
    <p class="by">Hector Tam　·　君秋雪　·　二〇二六年十月</p>
  </section>
</div>

<script src="app.js?v=1"></script>
<script>
  MUK.boot(function () { MUK.calendarPage(); });
</script>
</body>
</html>
