<div class="wrap">

  <header class="masthead">

    <span class="ft-sum" id="ft-sum"></span>
    <span class="ft-chev" aria-hidden="true"></span>

  <div class="filter-body" id="filter-body">

      <input type="date" id="jump" aria-label="由">

    <span class="frow-label">星期</span>
    <div class="weekbar" id="weekbar"></div>
  </div>

  <div class="frow">
    <span class="frow-label">地點</span>
    <div class="placebar">
      <input id="place" list="places" placeholder="場地名或關鍵字" autocomplete="off">
      <datalist id="places"></datalist>
    </div>
  </div>

  <div class="frow">
    <span class="frow-label">時間</span>
    <div class="timebar">
      <select id="tfrom" aria-label="由"><option value="">任何</option></select>
      <span class="dash">至</span>
      <select id="tto" aria-label="至"><option value="">任何</option></select>

    </div>
  </div>

  </div>
  </div>

    <p>資料每月更新一次。過期的不刪，標上「已結束」。</p>

  <p>幕是一個香港演出與展覽的日曆：把康文署各個場地、西九文化區、香港管弦樂團、香港話劇團、香港舞蹈團、M+、香港藝術館等單位的節目表，按日子排在同一條時間軸上，包括舞台劇、音樂會、舞蹈、戲曲、電影與博物館展覽。時間軸由 JavaScript 載入，請開啟 JavaScript，或看<a href="about.html">關於</a>一頁了解資料來源與用法。</p>
